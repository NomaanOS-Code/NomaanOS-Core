name: Red-Team Security Benchmark

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-benchmark:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Run Cryptographic Integrity Signer
      run: |
        PYTHONPATH=. python3 core/integrity_engine.py

    - name: Run Red-Team Hardening Benchmark
      run: |
        PYTHONPATH=. python3 tests/stress_test.py
