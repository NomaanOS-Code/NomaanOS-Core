name: Red-Team Security Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security-benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python sources
        run: |
          python3 -m py_compile core/*.py src/nomaanos/*.py tests/*.py

      - name: Run NOS Exec security tests
        run: |
          PYTHONPATH=. python3 tests/test_nos_exec.py

      - name: Run advanced red-team benchmark
        run: |
          PYTHONPATH=. python3 tests/redteam_advanced.py
