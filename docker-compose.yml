version: '3.8'

services:
  nomaanos-core:
    build: .
    container_name: nomaanos-core
    environment:
      - NODE_ENV=production
    volumes:
      - .:/app
    command: python3 stress_test.py

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: nomaanos-vault
    restart: always
    environment:
      - WEBSOCKET_ENABLED=true
    ports:
      - "8080:80"
    volumes:
      - ./data/vault:/data
